name: 🤖 AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr.diff || git diff origin/${{ github.base_ref }}..HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"

      - name: AI Code Review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python3 << 'PY'
          import os, json, urllib.request
          with open('/tmp/pr.diff', 'r') as f:
              diff = f.read()
          if not diff.strip():
              open('/tmp/review.md', 'w').write("⚠️ No diff found")
              exit(0)
          data = {
              "model": "kimi-for-coding",
              "max_tokens": 4000,
              "system": "你是代码审查员。输出格式：\n1. 审查结果：APPROVED / NEEDS_FIX\n2. 发现的问题\n3. 总结",
              "messages": [{"role": "user", "content": f"请审查：\n\n```diff\n{diff[:6000]}\n```"}]
          }
          req = urllib.request.Request('https://api.kimi.com/coding/v1/messages',
              data=json.dumps(data).encode(),
              headers={'Content-Type': 'application/json', 'x-api-key': os.environ['KIMI_API_KEY'], 'anthropic-version': '2023-06-01'})
          try:
              review = json.loads(urllib.request.urlopen(req).read())['content'][0]['text']
          except Exception as e:
              review = f"Error: {e}"
          open('/tmp/review.md', 'w').write(review)
          PY

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const review = require('fs').readFileSync('/tmp/review.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}`
            });
