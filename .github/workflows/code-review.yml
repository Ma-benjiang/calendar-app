name: 🤖 AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}..HEAD > /tmp/pr.diff
          echo "Diff size: $(wc -c < /tmp/pr.diff) bytes"
          head -50 /tmp/pr.diff

      - name: AI Code Review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import os
          import json
          import urllib.request

          # Read diff
          with open('/tmp/pr.diff', 'r') as f:
              diff_content = f.read()

          if not diff_content.strip():
              print("No diff found")
              exit(1)

          # Prepare API request
          api_key = os.environ['KIMI_API_KEY']
          headers = {
              'Content-Type': 'application/json',
              'x-api-key': api_key,
              'anthropic-version': '2023-06-01'
          }

          data = {
              "model": "kimi-for-coding",
              "max_tokens": 4000,
              "system": "你是代码审查员，负责审查代码变更。输出格式：\n1. 审查结果：APPROVED / NEEDS_FIX\n2. 发现的问题（位置、严重程度、建议）\n3. 总结",
              "messages": [
                  {
                      "role": "user",
                      "content": f"请审查以下代码变更：\n\n```diff\n{diff_content[:8000]}\n```"
                  }
              ]
          }

          # Call API
          req = urllib.request.Request(
              'https://api.kimi.com/coding/v1/messages',
              data=json.dumps(data).encode(),
              headers=headers,
              method='POST'
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())
              review_text = result['content'][0]['text']

          # Save review
          with open('/tmp/review.md', 'w') as f:
              f.write(review_text)

          print("Review generated successfully")
          print(review_text[:500])
          PYTHON_SCRIPT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');

            // Post comment only (GitHub Actions cannot approve)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 AI Code Review\n\n${review}`
            });

            console.log('Review comment posted');
