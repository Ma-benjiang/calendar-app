name: 🤖 AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: get-diff
        run: |
          git diff origin/${{ github.base_ref }}..HEAD > /tmp/pr.diff
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/pr.diff >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI Code Review
        id: ai-review
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          DIFF=$(cat /tmp/pr.diff | sed 's/"/\\"/g' | sed 's/\n/\\n/g')

          # 调用 Kimi API 进行审查 (Anthropic 格式)
          curl -s https://api.kimi.com/coding/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: $KIMI_API_KEY" \
            -H "anthropic-version: 2023-06-01" \
            -d "{
              \"model\": \"kimi-for-coding\",
              \"max_tokens\": 4000,
              \"system\": \"你是代码审查员，负责审查代码变更。输出格式：\\n1. 审查结果：APPROVED / NEEDS_FIX\\n2. 发现的问题（位置、严重程度、建议）\\n3. 总结\",
              \"messages\": [{
                \"role\": \"user\",
                \"content\": \"请审查以下代码变更：\\n\\n$DIFF\"
              }]
            }" | jq -r '.content[0].text' > /tmp/review.md

          echo "result<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/review.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.md', 'utf8');

            // 判断审查结果
            const isApproved = review.includes('APPROVED');

            // 创建审查
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: review,
              event: isApproved ? 'APPROVE' : 'REQUEST_CHANGES'
            });

            console.log(`Review posted: ${isApproved ? 'APPROVED' : 'NEEDS_FIX'}`);
