name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']

env:
  NODE_VERSION: '18'

jobs:
  quality-check:
    name: ✅ Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web

  build-desktop-macos:
    name: 🍎 Build macOS
    runs-on: macos-latest
    needs: [quality-check, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - name: Clean dist folder
        run: rm -rf apps/desktop/dist/*
      - run: cd apps/desktop && pnpm build:mac
      - name: Verify output
        run: ls -la apps/desktop/dist/
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/desktop/dist/Pie-*.dmg
          if-no-files-found: error

  build-desktop-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest
    needs: [quality-check, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - name: Clean dist folder
        run: Remove-Item -Path "apps/desktop/dist/*" -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh
      - run: cd apps/desktop && pnpm build:win
        shell: cmd
      - name: Verify output
        run: ls apps/desktop/dist/
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: apps/desktop/dist/Pie*.exe
          if-no-files-found: error

  build-desktop-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    needs: [quality-check, build-web]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - name: Clean dist folder
        run: rm -rf apps/desktop/dist/*
      - run: cd apps/desktop && pnpm build:linux
      - name: Verify output
        run: ls -la apps/desktop/dist/
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: apps/desktop/dist/Pie-*.AppImage
          if-no-files-found: error

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-desktop-macos, build-desktop-windows, build-desktop-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List Artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la artifacts/
          echo "=== File count ==="
          find artifacts/ -type f | wc -l
      - name: Delete existing release assets
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Checking for existing release: $TAG"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id' 2>/dev/null || echo "")
          if [ -n "$RELEASE_ID" ]; then
            echo "Found release ID: $RELEASE_ID"
            gh api repos/${{ github.repository }}/releases/$TAG/assets --jq '.[].id' | while read asset_id; do
              echo "Deleting asset: $asset_id"
              gh api --method DELETE repos/${{ github.repository }}/releases/assets/$asset_id
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
