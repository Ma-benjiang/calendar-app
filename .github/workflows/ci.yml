name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']

env:
  NODE_VERSION: '18'

jobs:
  build-web:
    name: 🌐 Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      # Web 静态文件不发布，只用于 Desktop 构建

  build-desktop-macos:
    name: 🍎 Build macOS
    runs-on: macos-latest
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - run: cd apps/desktop && pnpm build:mac
      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: apps/desktop/dist/*.dmg

  build-desktop-windows:
    name: 🪟 Build Windows
    runs-on: windows-latest
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - run: cd apps/desktop && pnpm build:win
        shell: cmd
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: apps/desktop/dist/*.exe

  build-desktop-linux:
    name: 🐧 Build Linux
    runs-on: ubuntu-latest
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:web
      - run: cd apps/desktop && pnpm build:linux
      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: apps/desktop/dist/*.AppImage

  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [build-desktop-macos, build-desktop-windows, build-desktop-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List Artifacts
        run: ls -la artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
